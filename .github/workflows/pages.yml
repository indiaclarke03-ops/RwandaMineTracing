name: Deploy site

# Pages currently serves from the main branch root (index.html redirects to site/).
# This workflow is only needed if Pages source is switched to "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate seed data
        run: python3 pipeline/build.py --check
      - name: Assemble site (site/ + data/)
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
